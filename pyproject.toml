[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "document-portfolio-generator"
version = "0.1.0"
description = "Generate consistent Markdown, DOCX, and PDF portfolios from validated JSON data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Meherwer Ali" }
]
dependencies = [
  "python-docx>=1.1,<2",
  "reportlab>=4,<5",
]

[project.scripts]
portfolio-docs = "document_portfolio_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
